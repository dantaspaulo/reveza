# Instala o Reveza de verdade em macOS, Linux e Windows (os três sistemas que ele promete), do mesmo jeito que o
# `npx github:dantaspaulo/reveza` deixa: o repositório dentro de um node_modules. Sem nuvem, sem serviço e sem conta:
# o que se prova aqui é que o instalador roda, copia, compila o agente e o comando `reveza` responde em cada sistema.
name: Install on all three OSes

# o ensaio acha a sua execução pelo nome (várias sessões podem ensaiar ao mesmo tempo); sem id, o nome de sempre
run-name: ${{ inputs.id && format('ensaio {0}', inputs.id) || '' }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      id:
        description: "trial run id (scripts/ensaio.mjs finds the run by its name)"
        required: false
        default: ""
      ensaio:
        description: "raw URL of a secret gist owned by the repository owner with the change to try out (git diff | gzip | base64); empty = main"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  instalar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # ensaio de uma mudança ainda não publicada (scripts/ensaio.mjs): aplica e commita aqui, porque o passo da
      # instalação empacota com `git archive HEAD`
      - name: Trial run (manual dispatch with a change only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.ensaio != '' }}
        shell: bash
        env:
          DONO: ${{ github.repository_owner }}
        run: |
          # só o endereço "raw" de um gist do dono, no formato exato (nada de "..", "@" ou outro usuário no caminho), e sem
          # seguir redirecionamento
          G='^https://gist\.githubusercontent\.com/([A-Za-z0-9-]+)/[0-9a-f]{20,40}/raw/[0-9a-f]{40}/[A-Za-z0-9][A-Za-z0-9._-]*$'
          A="$RUNNER_TEMP/ensaio.b64"
          # a mudança é lida do evento, não de env: o que vai em env aparece no cabeçalho do passo, no log público
          ENSAIO="$(jq -r '.inputs.ensaio // ""' "$GITHUB_EVENT_PATH")"
          if [[ "$ENSAIO" =~ $G ]] && [ "${BASH_REMATCH[1]}" = "$DONO" ]; then
            curl -fsS --proto =https --max-redirs 0 "$ENSAIO" -o "$A"
          elif [[ "$ENSAIO" == http* ]]; then
            echo "only gists owned by the repository owner are accepted" >&2; exit 1
          else
            printf '%s' "$ENSAIO" > "$A"
          fi
          base64 -d < "$A" | gunzip | git apply -v --whitespace=nowarn
          git add -A
          git -c user.name=ensaio -c user.email=ensaio@exemplo.invalid commit -q -m "ensaio"

      - name: Agent tests
        working-directory: agente
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test

      - name: Installer, from inside a node_modules (the way npx installs it)
        shell: bash
        run: |
          # no Windows, o RUNNER_TEMP vem como D:\a\_temp, que o tar entende como "máquina:caminho"; o caminho do bash não
          T=$(cd "$RUNNER_TEMP" && pwd)
          D="$T/npx/node_modules/reveza"
          mkdir -p "$D"
          git archive HEAD | tar -x -C "$D"
          export HOME="$RUNNER_TEMP/casa" USERPROFILE="$RUNNER_TEMP/casa"
          mkdir -p "$HOME"
          cd "$D"
          node instalador/instalar.mjs --sim --sem-servico --sem-nuvem --sem-react-bits 2>&1 | tee "$RUNNER_TEMP/saida.txt"
          grep -q "Pronto: Reveza AI" "$RUNNER_TEMP/saida.txt"

      - name: The reveza command responds
        shell: bash
        run: |
          export HOME="$RUNNER_TEMP/casa" USERPROFILE="$RUNNER_TEMP/casa"
          node "$HOME/.reveza/app/agente/dist/src/cli.js" versao
          node "$HOME/.reveza/app/agente/dist/src/cli.js" doctor || true
